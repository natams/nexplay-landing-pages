<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta id="metaDescription" name="description" content="" />

    <title>NexPlay Sports</title>

    <link rel="icon" type="image/svg+xml" href="img/icon.svg" />

    <link rel="stylesheet" href="../assets/styles.css" />
    <link rel="stylesheet" href="assets/sports.css" />

    <script src="assets/sports.js" defer></script>
</head>

<body>
    <div class="loading-screen" id="loadingScreen" role="status" aria-live="polite" aria-label="Loading experience">
        <div class="loading-icon-wrapper">
            <img class="loading-icon" id="loadingIcon" src="img/icon.svg" alt="" width="90" height="90" />
        </div>
    </div>

    <main class="sports-page" id="landingPage" aria-hidden="true">
        <header class="site-header">
            <a class="site-logo" id="siteLogoLink" href="#" aria-label="NexPlay home">
                <img id="siteLogo" src="img/logo.svg" alt="NexPlay" width="145" height="40" />
            </a>

            <nav class="header-actions" aria-label="Account actions">
                <a class="signup-link" id="signupLink" href="#"> </a>

                <a class="login-link" id="loginLink" href="#"> </a>
            </nav>
        </header>

        <section class="sports-hero" aria-labelledby="sportsHeadline">
            <div class="sports-hero-image" aria-hidden="true"></div>
            <div class="sports-hero-overlay" aria-hidden="true"></div>

            <div class="sports-hero-content">
                <div class="sports-offer-panel" id="sportsOfferPanel">
                    <p class="sports-pre-header" id="sportsPreHeader"></p>

                    <h1 id="sportsHeadline"></h1>

                    <p class="sports-intro" id="sportsIntro"></p>

                    <button class="sports-primary-button" id="sportsRevealButton" type="button"></button>
                </div>

                <div class="sports-match-list-stage" id="sportsMatchListStage" aria-hidden="true">
                    <div class="match-list-panel">
                        <div class="match-list-heading">
                            <p id="matchListPreHeader"></p>
                            <h2 id="matchListTitle"></h2>
                            <span id="matchListIntro"></span>
                        </div>

                        <div class="match-choice-grid" id="matchChoiceGrid"></div>

                        <div class="selection-summary" id="selectionSummary" aria-live="polite">
                            <span id="selectionSummaryLabel"></span>
                            <strong id="selectionSummaryText"></strong>
                        </div>

                        <button class="sports-confirm-button" id="sportsConfirmButton" type="button" disabled></button>

                        <div class="sports-offer-terms">
                            <p id="sportsTermsSummary"></p>

                            <button class="sports-terms-toggle" id="sportsTermsToggle" type="button"
                                aria-expanded="false" aria-controls="sportsTermsDetails" aria-label="Show offer terms">
                                <span class="sports-terms-toggle-icon" aria-hidden="true">⌄</span>
                                <span class="sports-terms-toggle-text">Offer terms</span>
                            </button>

                            <div class="sports-terms-details" id="sportsTermsDetails">
                                <div class="sports-terms-details-inner">
                                    <p id="sportsTermsDetailsText"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="sports-reward-stage" id="sportsRewardStage" aria-hidden="true">
                    <img class="reward-particles" id="rewardParticles" src="img/reward-particles.webp" alt=""
                        aria-hidden="true" />

                    <div class="sports-ticket">
                        <img class="sports-ticket-image" id="sportsTicketImage" src="img/reward-ticket.webp" alt=""
                            aria-hidden="true" />

                        <div class="sports-ticket-content">
                            <p class="sports-reward-label" id="sportsRewardLabel"></p>

                            <h2 id="sportsRewardTitle"></h2>

                            <strong class="sports-reward-prediction" id="sportsRewardPrediction"></strong>

                            <a class="sports-claim-button" id="sportsClaimButton" href="#"></a>

                            <p class="sports-reward-terms" id="sportsRewardTerms"></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="legal-footer">
        <div class="payment-section" aria-label="Supported payment methods">
            <div class="payment-logos" id="paymentLogos"></div>
        </div>

        <p id="legalText"></p>

        <nav class="legal-links" id="legalLinks" aria-label="Legal links"></nav>
    </footer>
</body>

</html>
