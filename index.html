<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta id="metaDescription" name="description" content="" />

    <title>NexPlay</title>
    <link id="favicon" rel="icon" type="image/svg+xml" href="img/icon.svg" />

    <link rel="stylesheet" href="assets/styles.css" />
    <script src="assets/index.js" defer></script>
</head>

<body>
    <main class="home-page" id="landingPage">
        <header class="site-header">
            <a class="site-logo" id="siteLogoLink" href="#" aria-label="NexPlay home">
                <img id="siteLogo" src="img/logo.svg" alt="NexPlay" width="145" height="40" />
            </a>

            <nav class="header-actions" aria-label="Account actions">
                <a class="signup-link" id="signupLink" href="#"> </a>

                <a class="login-link" id="loginLink" href="#"> </a>
            </nav>
        </header>

        <section class="experience-section" aria-labelledby="experienceTitle">
            <div class="experience-heading">
                <p id="pageLabel"></p>

                <h1 id="experienceTitle"></h1>

                <span id="pageAuthor"></span>
            </div>

            <div class="experience-grid" id="experienceGrid"></div>
        </section>
    </main>

    <footer class="legal-footer">
        <p id="legalText"></p>

        <nav class="legal-links" id="legalLinks" aria-label="Legal links"></nav>
    </footer>
</body>

</html>
