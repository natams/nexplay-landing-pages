<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta id="metaDescription" name="description" content="" />

    <title>NexPlay Casino</title>
    <link rel="icon" type="image/svg+xml" href="img/icon.svg" />

    <link rel="stylesheet" href="../assets/styles.css" />
    <link rel="stylesheet" href="assets/casino.css" />

    <script src="assets/casino.js" defer></script>
</head>

<body>
    <div class="loading-screen" id="loadingScreen" role="status" aria-live="polite" aria-label="Loading experience">
        <div class="loading-icon-wrapper">
            <img class="loading-icon" src="img/icon.svg" alt="" width="90" height="90" />
        </div>
    </div>

    <main class="casino-page" id="landingPage" aria-hidden="true">
        <header class="site-header">
            <a class="site-logo" id="siteLogoLink" href="../index.html" aria-label="NexPlay home">
                <img id="siteLogo" src="img/logo.svg" alt="NexPlay" width="145" height="40" />
            </a>

            <nav class="header-actions" aria-label="Account actions">
                <a class="signup-link" id="signupLink" href="#signup">Sign Up</a>
                <a class="login-link" id="loginLink" href="#login">Log In</a>
            </nav>
        </header>

        <section class="casino-hero" aria-labelledby="casinoHeadline">
            <div class="casino-hero-image" aria-hidden="true"></div>
            <div class="casino-hero-overlay" aria-hidden="true"></div>

            <div class="casino-content">
                <div class="offer-panel">
                    <div class="wheel-stage">
                        <img class="wheel-title" id="wheelTitle" src="img/wheel-title.webp" alt="" aria-hidden="true" />

                        <div class="wheel" id="wheel">
                            <img class="wheel-frame" id="wheelFrame" src="img/wheel-frame.webp" alt=""
                                aria-hidden="true" />

                            <div class="wheel-disc-holder" id="wheelDisc">
                                <img src="img/wheel-disc.webp" alt="Daily reward wheel" />
                            </div>

                            <img class="wheel-pointer" id="wheelPointer" src="img/wheel-pointer.webp" alt=""
                                aria-hidden="true" />

                            <button class="wheel-spin-button" id="spinButton" type="button"
                                aria-label="Spin today's reward wheel">
                                <img id="wheelSpinButtonImage" src="img/wheel-spin-button.webp" alt=""
                                    aria-hidden="true" />
                            </button>
                        </div>

                        <div class="spin-complete-popup" id="spinCompletePopup" aria-live="polite" aria-hidden="true">
                            <p class="spin-complete-label" id="spinCompleteLabel"></p>
                            <h2 id="spinCompleteTitle"></h2>
                        </div>
                    </div>

                    <div class="casino-copy">
                        <p class="pre-header" id="preHeader"></p>

                        <h1 id="casinoHeadline"></h1>

                        <p class="casino-intro" id="casinoIntro"></p>
                    </div>
                </div>
            </div>
        </section>

        <section class="how-it-works" id="howItWorks" aria-label="How it works"></section>
    </main>

    <div class="reward-popup" id="rewardPopup" role="dialog" aria-modal="true" aria-hidden="true"
        aria-labelledby="rewardTitle" aria-describedby="rewardDescription rewardTerms">
        <div class="reward-popup-backdrop" id="rewardPopupBackdrop" aria-hidden="true"></div>

        <section class="reward-card" id="rewardCard" tabindex="-1">
            <button class="reward-close-button" id="rewardCloseButton" type="button" aria-label="Close reward">
                ×
            </button>

            <p class="reward-label" id="rewardLabel"></p>

            <h2 id="rewardTitle"></h2>

            <p class="reward-description" id="rewardDescription"></p>

            <a class="claim-button" id="claimButton" href="#login"></a>

            <p class="reward-terms" id="rewardTerms"></p>
        </section>
    </div>

    <footer class="legal-footer">
        <div class="payment-section" aria-label="Supported payment methods">
            <div class="payment-logos" id="paymentLogos"></div>
        </div>

        <p id="legalText"></p>

        <nav class="legal-links" id="legalLinks" aria-label="Legal links"></nav>
    </footer>
</body>

</html>
